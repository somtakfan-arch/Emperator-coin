<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Remindly</title>
<meta name="theme-color" content="#0b0b0d" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../icons/favicon.png" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Remindly" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="app-shell">

  <div class="topbar" id="topbar">
    <div class="coin-badge" id="coin-badge">🪙 <span id="coin-count">0</span></div>
    <span class="date-label" id="date-label"></span>
    <div class="heading-row">
      <h1 id="view-title">Сегодня</h1>
      <span class="frac" id="view-frac"></span>
    </div>
    <div class="progress-track" id="progress-track" style="display:none">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <section class="view" id="view-today"></section>
  <section class="view" id="view-all" hidden></section>
  <section class="view" id="view-favorites" hidden></section>
  <section class="view" id="view-notes" hidden></section>
  <section class="view" id="view-profile" hidden></section>

  <button class="fab" id="fab-add" aria-label="Добавить напоминание">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m8.5 13.5 2 2 4-4.2"/></svg>
      Сегодня
    </button>
    <button class="nav-btn" data-view="all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>
      Все
    </button>
    <button class="nav-btn" data-view="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.6 9 2 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5 18 5 19.4 9 17.5 12.5 15 16.65 12 21 12 21z"/></svg>
      Избранное
    </button>
    <button class="nav-btn" data-view="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5M8 13h8M8 17h5"/></svg>
      Заметки
    </button>
    <button class="nav-btn" data-view="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
      Профиль
    </button>
  </nav>
</div>

<div class="sheet-overlay" id="sheet-overlay"></div>
<div class="sheet" id="add-sheet">
  <div class="sheet-handle"></div>
  <h2>Новое напоминание</h2>
  <form id="add-form">
    <div class="field">
      <label for="f-title">Название</label>
      <input class="text-input" id="f-title" type="text" placeholder="Например, Выпить воды" required maxlength="60" />
    </div>
    <div class="field">
      <label>Категория</label>
      <div class="chip-row" id="f-category"></div>
    </div>
    <div class="field">
      <label>Группа (необязательно)</label>
      <div class="chip-row" id="f-group"></div>
    </div>
    <div class="field">
      <label>Приоритет</label>
      <div class="chip-row" id="f-priority"></div>
    </div>
    <div class="two-col">
      <div class="field">
        <label for="f-time">Время</label>
        <input class="time-input" id="f-time" type="time" required />
      </div>
      <div class="field">
        <label>Повтор</label>
        <div class="chip-row" id="f-repeat"></div>
      </div>
    </div>
    <div class="field" id="f-date-field">
      <label for="f-date">Дата</label>
      <input class="date-input" id="f-date" type="date" />
    </div>
    <div class="field" id="f-weekdays-field" style="display:none">
      <label>Дни недели</label>
      <div class="chip-row" id="f-weekdays"></div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary" id="f-cancel">Отмена</button>
      <button type="submit" class="btn btn-primary">Добавить</button>
    </div>
  </form>
</div>

<div class="sheet" id="reminder-more-sheet">
  <div class="sheet-handle"></div>
  <h2 id="more-sheet-title">Задача</h2>
  <button type="button" class="profile-row" id="more-note-row">
    <span class="left">📝 Заметка к задаче</span>
  </button>
  <button type="button" class="profile-row" id="more-group-row">
    <span class="left">🗂 Папка / группа</span>
  </button>
  <button type="button" class="profile-row" id="more-priority-row">
    <span class="left">🚩 Приоритет</span>
  </button>
  <button type="button" class="profile-row" id="more-subtasks-row">
    <span class="left">☑️ Подзадачи</span>
  </button>
  <button type="button" class="profile-row" id="more-snooze-row">
    <span class="left">⏰ Отложить</span>
  </button>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" id="more-sheet-close">Закрыть</button>
  </div>
</div>

<div class="sheet" id="reminder-note-sheet">
  <div class="sheet-handle"></div>
  <h2>Заметка к задаче</h2>
  <div class="field">
    <textarea class="text-input note-textarea" id="reminder-note-text" placeholder="Детали, ссылки, что угодно…" rows="5"></textarea>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" id="reminder-note-cancel">Отмена</button>
    <button type="button" class="btn btn-primary" id="reminder-note-save">Сохранить</button>
  </div>
</div>

<div class="sheet" id="reminder-group-sheet">
  <div class="sheet-handle"></div>
  <h2>Папка / группа задачи</h2>
  <div class="chip-row" id="reminder-group-chips"></div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" id="reminder-group-close">Готово</button>
  </div>
</div>

<div class="sheet" id="reminder-priority-sheet">
  <div class="sheet-handle"></div>
  <h2>Приоритет задачи</h2>
  <div class="chip-row" id="reminder-priority-chips"></div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" id="reminder-priority-close">Готово</button>
  </div>
</div>

<div class="sheet" id="reminder-subtasks-sheet">
  <div class="sheet-handle"></div>
  <h2>Подзадачи</h2>
  <div id="reminder-subtasks-list"></div>
  <div class="category-add-row">
    <input class="text-input" type="text" id="subtask-new-input" placeholder="Новый пункт" maxlength="60" />
    <button type="button" class="btn btn-primary" id="subtask-add-btn">Добавить</button>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" id="reminder-subtasks-close">Готово</button>
  </div>
</div>

<div class="sheet" id="reminder-snooze-sheet">
  <div class="sheet-handle"></div>
  <h2>Отложить задачу</h2>
  <div class="sheet-actions" style="flex-direction:column">
    <button type="button" class="btn btn-secondary" style="width:100%" id="snooze-1h">На 1 час</button>
    <button type="button" class="btn btn-secondary" style="width:100%" id="snooze-3h">На 3 часа</button>
    <button type="button" class="btn btn-secondary" style="width:100%" id="snooze-tomorrow">На завтра</button>
    <button type="button" class="btn btn-primary" style="width:100%" id="reminder-snooze-close">Отмена</button>
  </div>
</div>

<input type="file" id="import-file-input" accept="application/json" hidden />

<div class="toast" id="toast"></div>

<div class="update-banner" id="update-banner" hidden>
  <span>Доступна новая версия</span>
  <button type="button" id="update-reload-btn">Обновить</button>
</div>

<script src="app.js"></script>
</body>
</html>
