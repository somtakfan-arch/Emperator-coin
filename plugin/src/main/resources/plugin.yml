name: EmperatorBank
version: '1.0.0'
main: com.emperator.bank.EmperatorBankPlugin
api-version: '1.20'
author: Emperator Bank
description: Connects a Bedsmp Minecraft server to the Emperator Bank website.
softdepend: [Vault]

commands:
  bank:
    description: Emperator Bank commands
    usage: |
      /bank link <code> - link your Minecraft account to your bank account
      /bank balance - show your bank balance
      /bank deposit <amount> - move in-game money into the bank
      /bank withdraw <amount> - move bank money into the game
