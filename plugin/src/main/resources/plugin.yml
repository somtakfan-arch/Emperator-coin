name: EmperatorBank
version: '1.0.0'
main: com.emperator.bank.EmperatorBankPlugin
api-version: '1.20'
author: Emperator Bank
description: Connects a Bedsmp Minecraft server to the Emperator Bank website.
softdepend: [Vault]

commands:
  bank:
    description: Emperator Bank commands
    usage: |
      /bank link <code> - link your Minecraft account to your bank account
      /bank link <nickname> <code> - (console, or with permission) link another player's account
      /bank balance - show your bank balance
      /bank pay <nickname> <amount> - transfer EMP directly to another linked player
      /bank daily - claim the daily bonus (if enabled)
      /bank top [count] - show the richest bank accounts

permissions:
  emperatorbank.admin.link:
    description: Link another player's Minecraft account to a bank account using a site code
    default: op
