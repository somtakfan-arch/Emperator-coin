## ------------------------------------------------------------------
## FiveM sandbox server - reference config.
##
## setup.ps1 generates this file automatically with your license key,
## hostname and car resources already filled in. This copy is here so
## you can see what you are getting, or set things up by hand.
## ------------------------------------------------------------------

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_licenseKey "PASTE_YOUR_KEY_HERE"
sv_hostname "Emperator crew"
sv_maxclients 16

# OneSync обязателен: без него серверные координаты нулевые и ls_police
# не может проверить ни одно расстояние.
set onesync on
set onesync_population true
sv_scriptHookAllowed 0
sets locale "ru-RU"

# Uncomment and bump if newer DLC vehicles refuse to spawn.
#set sv_enforceGameBuild 3407

## --- base resources -----------------------------------------------
# chat, sessionmanager and hardcap are NOT listed here. Modern artifacts ship
# them under citizen/system_resources and start them on their own; naming them
# here only logs "Couldn't find resource" on every boot.
ensure mapmanager
ensure spawnmanager
ensure basic-gamemode

## --- vMenu --------------------------------------------------------
ensure vMenu

# Friends-only sandbox: everyone gets the whole menu.
# To lock it down later, drop this line and hand out permissions per player instead.
add_ace builtin.everyone "vMenu.Everything" allow

# Make yourself an admin (find your identifier in the server console on join):
#add_principal identifier.fivem:1234567 group.admin
#add_ace group.admin command allow

## --- phone, inventory and shops -----------------------------------
# F1 opens the phone, I opens the inventory. /park stores the called car,
# /parkhere records a parking spot. Shops are marked on the map; press E.
# Load order matters: phone_garage owns the wallet, ls_character owns the ped,
# ls_inventory owns items, ls_shops charges through them, and ls_rp moves
# documents and belongings between players.
ensure phone_garage
ensure ls_character
ensure ls_inventory
ensure ls_shops
ensure ls_medical
ensure ls_tuning
ensure ls_rp
ensure ls_police
ensure ls_gangs
ensure ls_crime
ensure ls_property
ensure ls_interact
ensure ls_armoury
ensure ls_forum
ensure ls_turf
ensure ls_city
ensure ls_business
ensure ls_world

# Who may hand out money with /givemoney:
#add_ace group.admin garage.admin allow

## --- add-on cars --------------------------------------------------
# One line per resource folder in resources\[cars].
# Run `.\setup.ps1 -SyncPacksOnly` and it prints the exact list.
#ensure chiron
#ensure huracan

