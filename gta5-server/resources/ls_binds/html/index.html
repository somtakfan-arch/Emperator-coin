<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="head">

    <div class="foot" id="foot"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
