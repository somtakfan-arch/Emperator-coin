<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ls_tuning</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="shop" class="hidden">
  <header class="head">
    <div>
      <h1>Тюнинг</h1>
      <span class="sub" id="plate"></span>
    </div>
    <span class="open">Всё доступно сразу</span>
  </header>
  <div class="rows" id="rows"></div>
  <footer class="foot">
    <div class="total"><span>К оплате</span><b id="total">$0</b></div>
    <div class="actions">
      <button class="btn" id="cancel">Отмена</button>
      <button class="btn primary" id="apply">Установить всё</button>
    </div>
  </footer>
</div>
<script src="app.js?v=3"></script>
</body>
</html>
