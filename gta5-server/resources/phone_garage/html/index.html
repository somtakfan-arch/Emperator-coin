<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>phone_garage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone" class="hidden">
  <div class="bezel">
    <div class="screen">

      <div class="statusbar">
        <span id="clock">12:00</span>
        <span class="balance" id="balance">$0</span>
      </div>

      <!-- Home -->
      <section class="view" id="view-home">
        <div class="wallpaper">
          <div class="wallpaper-money" id="home-balance">$0</div>
          <div class="wallpaper-sub">на счету</div>
        </div>
        <div class="apps">
          <button class="app" data-open="garage">
            <span class="app-icon icon-garage"></span>
            <span class="app-name">Гараж</span>
            <span class="app-badge" id="garage-count">0</span>
          </button>
          <button class="app" data-open="shop">
            <span class="app-icon icon-shop"></span>
            <span class="app-name">Автосалон</span>
          </button>
          <button class="app" data-open="wardrobe">
            <span class="app-icon icon-wardrobe"></span>
            <span class="app-name">Гардероб</span>
            <span class="app-badge" id="wardrobe-count">0</span>
          </button>
          <button class="app" data-open="family">
            <span class="app-icon icon-family"></span>
            <span class="app-name">Семья</span>
            <span class="app-badge hidden" id="family-badge">!</span>
          </button>
          <button class="app" data-open="estate">
            <span class="app-icon icon-estate"></span>
            <span class="app-name">Недвижимость</span>
          </button>
          <button class="app" data-open="auction">
            <span class="app-icon icon-auction"></span>
            <span class="app-name">Аукцион</span>
            <span class="app-badge" id="auction-count">0</span>
          </button>
        </div>
        <p class="hint">ESC — закрыть · /park — убрать машину · /parkhere — записать парковку</p>
      </section>

      <!-- Family -->
      <section class="view hidden" id="view-family">
        <header class="appbar">
          <button class="back" data-open="home">‹</button>
          <h1>Семья</h1>
        </header>
        <div class="scroll" id="family-body"></div>
      </section>

      <!-- Estate -->
      <section class="view hidden" id="view-estate">
        <header class="appbar">
          <button class="back" data-open="home">‹</button>
          <h1>Недвижимость</h1>
        </header>
        <div class="chips" id="estate-chips"></div>
        <div class="scroll" id="estate-list"></div>
      </section>

      <!-- Auction -->
      <section class="view hidden" id="view-auction">
        <header class="appbar">
          <button class="back" data-open="home">‹</button>
          <h1>Аукцион</h1>
        </header>
        <div class="chips" id="auction-chips"></div>
        <div class="scroll" id="auction-list"></div>
      </section>

      <!-- Garage -->
      <section class="view hidden" id="view-garage">
        <header class="appbar">
          <button class="back" data-open="home">‹</button>
          <h1>Гараж</h1>
        </header>
        <div class="scroll" id="garage-list"></div>
      </section>

      <!-- Wardrobe -->
      <section class="view hidden" id="view-wardrobe">
        <header class="appbar">
          <button class="back" data-open="home">‹</button>
          <h1>Гардероб</h1>
        </header>
        <div class="pack hidden" id="pack-card">
          <div>
            <b>Рюкзак</b>
            <span class="pack-note" id="pack-note">+18 слотов в инвентаре</span>
          </div>
          <button class="btn primary" id="pack-buy">Купить</button>
        </div>
        <div class="saver">
          <input id="outfit-name" type="text" maxlength="24" placeholder="Название образа">
          <button class="btn primary" id="outfit-save">Сохранить текущий</button>
        </div>
        <div class="scroll" id="wardrobe-list"></div>
      </section>

      <!-- Dealership -->
      <section class="view hidden" id="view-shop">
        <header class="appbar">
          <button class="back" data-open="home">‹</button>
          <h1>Автосалон</h1>
        </header>
        <div class="chips" id="shop-chips"></div>
        <div class="scroll" id="shop-list"></div>
      </section>

    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
