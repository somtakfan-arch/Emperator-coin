<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация — Emperator Bank</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="imperial">
    <div class="brand"><a href="/index.html" style="text-decoration:none;color:inherit">Emperator Bank</a></div>
    <nav>
      <a href="/login.html">Вход</a>
    </nav>
  </header>
  <main>
    <div class="panel" style="max-width:420px;margin:2rem auto;">
      <h2>Регистрация</h2>
      <form id="register-form">
        <div>
          <label for="username">Ник (3-16 символов, латиница/цифры/_)</label>
          <input id="username" type="text" required />
        </div>
        <div>
          <label for="password">Пароль (мин. 6 символов)</label>
          <input id="password" type="password" required />
        </div>
        <div>
          <label for="ref">Ник пригласившего (необязательно)</label>
          <input id="ref" type="text" />
        </div>
        <p id="error" class="error" style="display:none"></p>
        <button type="submit">Создать счёт</button>
      </form>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('ref')) document.getElementById('ref').value = params.get('ref');

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const ref = document.getElementById('ref').value.trim();
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      try {
        const data = await api('/auth/register', { method: 'POST', body: { username, password, ref: ref || undefined } });
        setToken(data.token);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
