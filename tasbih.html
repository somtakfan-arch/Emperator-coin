<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Чётки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --ink:#12100d;
    --ink-2:#1a1712;
    --ink-3:#231f18;
    --line:#332d23;
    --fg:#efe7d8;
    --dim:#9a8f7c;
    --brass:#c9922e;
    --brass-soft:#e0b45c;
    --jade:#6f9d7d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% -10%, #1c1811 0%, rgba(28,24,17,0) 62%),
      var(--ink);
    color:var(--fg);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  header{
    width:100%;max-width:440px;display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;padding:18px 4px 0;
  }
  .mark{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .stats{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .stats b{color:var(--jade);font-weight:500}

  main{flex:1;display:flex;align-items:center;justify-content:center;width:100%}

  .bead{
    position:relative;width:min(76vw,330px);aspect-ratio:1;border-radius:50%;
    display:grid;place-items:center;cursor:pointer;
    background:
      radial-gradient(circle at 34% 26%, #2b2418 0%, #1d1913 52%, #120f0b 100%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,236,200,.07),
      inset 0 -18px 40px rgba(0,0,0,.45);
    transition:transform .14s cubic-bezier(.3,.8,.4,1);
  }
  .bead:focus-visible{outline:2px solid var(--brass-soft);outline-offset:6px}
  .bead.active{transform:scale(.962)}
  .bead.flash{animation:pop .32s cubic-bezier(.3,1.2,.5,1)}
  @keyframes pop{0%{transform:scale(.962)}45%{transform:scale(1.04)}100%{transform:scale(1)}}

  svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  svg.ring circle{fill:none;stroke-linecap:round}
  .track{stroke:var(--line);stroke-width:5}
  .prog{stroke:var(--brass);stroke-width:5;transition:stroke-dashoffset .05s linear}

  .readout{position:relative;text-align:center;padding-bottom:4px}
  .n{
    font-family:Spectral,Georgia,"Times New Roman",serif;font-weight:300;
    font-size:clamp(64px,22vw,104px);line-height:1;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;color:var(--fg);
  }
  .of{
    margin-top:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    font-variant-numeric:tabular-nums;
  }
  .hint{margin-top:4px;font-size:13px;color:var(--dim);min-height:18px}

  footer{width:100%;max-width:440px;display:flex;gap:8px;padding:0 4px 20px}
  button{
    flex:1;padding:13px 8px;border-radius:12px;border:1px solid var(--line);
    background:var(--ink-2);color:var(--fg);font:inherit;font-size:14px;
    font-variant-numeric:tabular-nums;cursor:pointer;transition:background .12s;
  }
  button:hover{background:var(--ink-3)}
  button:active{background:var(--ink-3)}
  button:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
  button .k{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
    background:var(--ink-3);border:1px solid var(--line);color:var(--fg);
    padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;
    transition:opacity .2s,transform .2s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    .bead,.bead.flash,.prog,.toast{transition:none;animation:none}
  }
</style>

<header>
  <div class="mark">Чётки</div>
  <div class="stats">кругов <b id="laps">0</b> &nbsp;·&nbsp; всего <span id="total">0</span></div>
</header>

<main>
  <div class="bead" id="bead" role="button" tabindex="0" aria-label="Зажмите, чтобы засчитать">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="46"></circle>
      <circle class="prog" id="prog" cx="50" cy="50" r="46"></circle>
    </svg>
    <div class="readout">
      <div class="n" id="count">0</div>
      <div class="of" id="of">из 33</div>
      <div class="hint" id="hint">зажми и держи</div>
    </div>
  </div>
</main>

<footer>
  <button id="target"><span class="k">Круг</span><span id="targetVal">33</span></button>
  <button id="speed"><span class="k">Зажим</span><span id="speedVal">0,3 с</span></button>
  <button id="reset"><span class="k">Сброс</span>зажать</button>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var C = 2 * Math.PI * 46;
  var prog = document.getElementById('prog');
  prog.style.strokeDasharray = C;

  var TARGETS = [33, 99, 100, 108, 1000, 0];
  var HOLDS = [150, 300, 500, 800];

  var bead = document.getElementById('bead');
  var elCount = document.getElementById('count');
  var elOf = document.getElementById('of');
  var elLaps = document.getElementById('laps');
  var elTotal = document.getElementById('total');
  var elHint = document.getElementById('hint');
  var btnT = document.getElementById('target'), valT = document.getElementById('targetVal');
  var btnS = document.getElementById('speed'), valS = document.getElementById('speedVal');
  var btnR = document.getElementById('reset');
  var toastEl = document.getElementById('toast');

  function load(){
    try{
      var s = JSON.parse(localStorage.getItem('tasbih') || '{}');
      return {
        count: s.count | 0, laps: s.laps | 0, total: s.total | 0,
        target: (s.target === undefined ? 33 : s.target | 0),
        hold: s.hold || 300
      };
    }catch(e){
      return {count:0, laps:0, total:0, target:33, hold:300};
    }
  }
  var S = load();
  function save(){ try{ localStorage.setItem('tasbih', JSON.stringify(S)); }catch(e){} }

  function render(){
    elCount.textContent = S.count;
    elOf.textContent = S.target ? 'из ' + S.target : 'без круга';
    elLaps.textContent = S.laps;
    elTotal.textContent = S.total;
    valT.textContent = S.target ? S.target : '∞';
    valS.textContent = (S.hold / 1000).toFixed(S.hold % 1000 ? 2 : 0).replace(/0$/, '').replace('.', ',') + ' с';
  }
  function toast(t){
    toastEl.textContent = t;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1300);
  }
  function buzz(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
  function setProg(p){ prog.style.strokeDashoffset = C * (1 - p); }

  var raf = null, start = 0, held = false, dur = 300;

  function tick(){
    var p = Math.min(1, (performance.now() - start) / dur);
    setProg(p);
    if(p >= 1){ fire(); return; }
    raf = requestAnimationFrame(tick);
  }
  function begin(e){
    if(e && e.cancelable) e.preventDefault();
    if(held) return;
    held = true; dur = S.hold; start = performance.now();
    bead.classList.add('active');
    bead.classList.remove('flash');
    elHint.textContent = 'держи…';
    raf = requestAnimationFrame(tick);
  }
  function end(){
    if(!held) return;
    held = false;
    cancelAnimationFrame(raf);
    setProg(0);
    bead.classList.remove('active');
    elHint.textContent = 'зажми и держи';
  }
  function fire(){
    held = false;
    cancelAnimationFrame(raf);
    setProg(0);
    bead.classList.remove('active');
    bead.classList.add('flash');
    setTimeout(function(){ bead.classList.remove('flash'); }, 340);

    S.count++; S.total++;
    if(S.target && S.count >= S.target){
      S.count = 0; S.laps++;
      buzz([40,60,40,60,120]);
      toast('Круг ' + S.laps + ' завершён');
    } else {
      buzz(28);
    }
    elHint.textContent = 'отпусти';
    save(); render();
  }

  bead.addEventListener('pointerdown', begin);
  bead.addEventListener('pointerup', end);
  bead.addEventListener('pointercancel', end);
  bead.addEventListener('pointerleave', end);
  bead.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  document.addEventListener('keydown', function(e){
    if((e.code === 'Space' || e.code === 'Enter') && !e.repeat){ e.preventDefault(); begin(e); }
  });
  document.addEventListener('keyup', function(e){
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); end(); }
  });

  btnT.addEventListener('click', function(){
    S.target = TARGETS[(TARGETS.indexOf(S.target) + 1) % TARGETS.length];
    if(S.target && S.count >= S.target) S.count = 0;
    save(); render();
    toast(S.target ? 'Круг: ' + S.target : 'Без круга');
  });
  btnS.addEventListener('click', function(){
    S.hold = HOLDS[(HOLDS.indexOf(S.hold) + 1) % HOLDS.length];
    save(); render();
    toast('Держать ' + (S.hold / 1000).toString().replace('.', ',') + ' сек');
  });

  var rt = null;
  btnR.addEventListener('pointerdown', function(e){
    if(e.cancelable) e.preventDefault();
    clearTimeout(rt);
    rt = setTimeout(function(){
      S.count = 0; S.laps = 0; S.total = 0;
      save(); render(); buzz([60,50,60]); toast('Сброшено');
    }, 900);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    btnR.addEventListener(ev, function(){ clearTimeout(rt); });
  });

  if('wakeLock' in navigator){
    var req = function(){ navigator.wakeLock.request('screen').catch(function(){}); };
    req();
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible') req();
    });
  }

  setProg(0);
  render();
})();
</script>
</head>
<body>
</body>
</html>
