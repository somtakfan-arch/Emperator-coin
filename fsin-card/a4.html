<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ФСИН — лист А4</title>
<style>
@page{size:A4;margin:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{background:#fff}
body{font-family:"DejaVu Sans",sans-serif}
.sheet{width:210mm;height:297mm;padding:12mm 10mm;display:flex;flex-direction:column;justify-content:space-between;margin:0 auto;background:#fff}
.row{display:flex;justify-content:center;position:relative;outline:0.3mm dashed #999;outline-offset:1.5mm;width:190mm;margin:0 auto}
.row::after{content:"";position:absolute;left:95mm;top:-4mm;bottom:-4mm;border-left:0.3mm dashed #999}
.slot{width:95mm;height:60mm;overflow:hidden;position:relative}
.slot>.card{transform:scale(0.28051);transform-origin:0 0;position:absolute;top:0;left:0}
.hint{position:absolute;left:0;right:0;bottom:4mm;text-align:center;font-size:8pt;color:#888}
@media screen{body.pv{background:#555}body.pv .sheet{margin:20px auto;box-shadow:0 5px 30px #000}}

*{box-sizing:border-box;margin:0;padding:0}

.card{width:1280px;height:808px;border-radius:0;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 20% 0%,#2a2d36 0%,#14151a 55%,#0c0c10 100%);
  border:3px solid #9aa0aa;color:#e8eaee}
.card::before{content:"";position:absolute;inset:18px;border:1.5px solid rgba(200,205,215,.35);border-radius:24px;pointer-events:none}
.wm{position:absolute;right:-60px;bottom:-80px;width:620px;height:620px;opacity:.06}
.head{display:flex;align-items:center;gap:30px;padding:46px 60px 26px;border-bottom:2px solid rgba(200,205,215,.25)}
.head svg{width:130px;height:130px;flex:none}
.title{flex:1}
.fsin{font-family:"DejaVu Serif",serif;font-weight:bold;font-size:92px;letter-spacing:22px;
  background:linear-gradient(180deg,#ffffff,#b9bec8 50%,#7d828c);-webkit-background-clip:text;color:transparent;line-height:1}
.sub{font-size:26px;letter-spacing:8px;color:#aab0ba;margin-top:10px}
.num{text-align:right;font-family:"DejaVu Sans Mono",monospace}
.num small{display:block;font-size:20px;letter-spacing:4px;color:#8a909a}
.num b{font-size:64px;color:#e8eaee;letter-spacing:6px}
.body{display:flex;gap:50px;padding:40px 60px 0}
.photo{width:270px;height:360px;flex:none;border-radius:14px;border:2px solid #9aa0aa;
  background:repeating-linear-gradient(45deg,#1c1d23 0 14px,#202128 14px 28px);
  display:flex;align-items:center;justify-content:center;color:#6d727c;font-size:30px;text-align:center}
.fields{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr);row-gap:20px;align-content:start}
.l{font-size:22px;letter-spacing:3px;color:#8a909a;text-transform:uppercase;padding-top:8px}
.v{font-size:36px;font-weight:bold;color:#f2f3f5;border-bottom:1.5px solid rgba(200,205,215,.2);padding-bottom:6px;white-space:nowrap;min-width:0;overflow:hidden}
.v.multi{font-size:25px;line-height:1.3;white-space:normal}
.fields{row-gap:14px!important}
.v.rank{background:linear-gradient(90deg,#ffffff,#aeb3bd);-webkit-background-clip:text;color:transparent}
.foot{position:absolute;left:60px;right:60px;bottom:40px;display:flex;justify-content:space-between;align-items:flex-end}
.dates{font-size:22px;color:#aab0ba;line-height:1.6}
.dates b{color:#e8eaee}
.school{font-size:20px;letter-spacing:3px;color:#7d828c;margin-top:6px}
.sign{text-align:center;font-size:20px;color:#8a909a;position:relative}
.sign .line{width:300px;border-bottom:1.5px solid #9aa0aa;height:60px;margin-bottom:8px;
  font-family:"DejaVu Serif",serif;font-style:italic;font-size:40px;color:#c9ced8;display:flex;align-items:flex-end;justify-content:center}
.stamp{position:absolute;right:330px;bottom:-20px;width:170px;height:170px;opacity:.55;transform:rotate(-14deg)}
/* back */
.back{display:flex}
.back .oath{width:440px;flex:none;padding:56px 40px 50px 60px;border-right:2px solid rgba(200,205,215,.25);display:flex;flex-direction:column;align-items:center;text-align:center}
.back .oath svg{width:150px;height:150px}
.back .motto{font-family:"DejaVu Serif",serif;font-weight:bold;font-size:30px;letter-spacing:5px;line-height:1.5;margin:18px 0 20px;
  background:linear-gradient(180deg,#ffffff,#aeb3bd);-webkit-background-clip:text;color:transparent}
.back .vow{font-family:"DejaVu Serif",serif;font-style:italic;font-size:22px;line-height:1.55;color:#aab0ba}
.back .pw{flex:1;padding:56px 60px 50px 50px;display:flex;flex-direction:column}
.back h2{font-family:"DejaVu Serif",serif;font-size:34px;letter-spacing:7px;color:#dfe2e8;margin-bottom:24px}
.back ol{list-style:none;counter-reset:n}
.back li{counter-increment:n;font-size:29px;line-height:1.35;color:#e8eaee;padding:16px 0 16px 60px;position:relative;border-bottom:1.5px solid rgba(200,205,215,.14)}
.back li::before{content:counter(n,upper-roman);position:absolute;left:0;top:16px;font-family:"DejaVu Serif",serif;font-weight:bold;color:#8a909a}
.back .ownsign{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:19px;color:#8a909a}
.back .ownsign .ln{width:280px;border-bottom:1.5px solid #9aa0aa;height:40px;margin-bottom:6px}
.back .note{font-size:15px;letter-spacing:1px;color:#6d727c;margin-top:14px}
.serial{font-family:"DejaVu Sans Mono",monospace;font-size:24px;color:#8a909a;letter-spacing:4px}

</style></head><body>

<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="sv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#b9bec8"/><stop offset="1" stop-color="#6f747e"/></linearGradient>
  <symbol id="emb" viewBox="0 0 200 200">
   <path d="M100 18 L172 44 V100 C172 142 140 170 100 184 C60 170 28 142 28 100 V44 Z" fill="#15161b" stroke="url(#sv)" stroke-width="6"/>
   <path d="M100 32 L160 54 V100 C160 134 134 158 100 170 C66 158 40 134 40 100 V54 Z" fill="none" stroke="url(#sv)" stroke-width="2" opacity=".6"/>
   <path d="M62 112 L56 72 L78 90 L100 60 L122 90 L144 72 L138 112 Z" fill="url(#sv)"/>
   <rect x="62" y="118" width="76" height="10" rx="2" fill="url(#sv)"/>
   <circle cx="56" cy="70" r="5" fill="url(#sv)"/><circle cx="100" cy="57" r="6" fill="url(#sv)"/><circle cx="144" cy="70" r="5" fill="url(#sv)"/>
   <path d="M78 142 H122" stroke="url(#sv)" stroke-width="3"/>
  </symbol>
 </defs>
</svg>


<div class="sheet" id="sheet" style="position:relative"></div>
<script src="people.js" onerror="void 0"></script>
<script>
const list = x => Array.isArray(x) ? x : [x];
// ЗАПОЛНИ СВОИ ДАННЫЕ: 4 удостоверения на лист
const people = window.PEOPLE || [
  {fam:"Иванов",  io:"Александр Евгеньевич", rank:"Генерал-полковник", pos:"Начальник ФСИН",     dep:"Штаб",                 sn:347},
  {fam:"Петров",  io:"Владимир Сергеевич",   rank:"Генерал-лейтенант", pos:"Заместитель начальника", dep:"Штаб",             sn:512},
  {fam:"Смирнов", io:"Максим Андреевич",     rank:"Капитан",           pos:"Начальник отдела",   dep:"Отдел охраны порядка", sn:128},
  {fam:"Кузнецов",io:"Даниил Олегович",      rank:"Рядовой",           pos:"Сотрудник",          dep:"Дисциплинарный отдел", sn:903},
];
const FRONT = p => `<div class="card"><svg class="wm"><use href="#emb"/></svg>
 <div class="head">
  <svg><use href="#emb"/></svg>
  <div class="title"><div class="fsin">ФСИН</div><div class="sub">СЛУЖЕБНОЕ УДОСТОВЕРЕНИЕ</div></div>
  <div class="num"><small>№ СЕРИЯ</small><b>${p.sn}</b></div>
 </div>
 <div class="body">
  ${p.photo ? `<div class="photo" style="background:url('${p.photo}') ${p.photoPos||'50% 35%'}/${p.photoZoom||'130%'} no-repeat"></div>` : `<div class="photo">ФОТО<br>3×4</div>`}
  <div class="fields">
   <div class="l">Фамилия</div><div class="v">${p.fam}</div>
   <div class="l">Имя, отчество</div><div class="v">${p.io}</div>
   <div class="l">Звание</div><div class="v rank">${p.rank}</div>
   <div class="l">${list(p.pos).length>1?'Должности':'Должность'}</div><div class="v${list(p.pos).length>1?' multi':''}">${list(p.pos).join('<br>')}</div>
   <div class="l">${list(p.dep).length>1?'Отделы':'Отдел'}</div><div class="v${list(p.dep).length>1?' multi':''}">${list(p.dep).join(' · ')}</div>
  </div>
 </div>
 <div class="foot">
  <div>
   <div class="dates">Выдано: <b>01.09.2025</b> &nbsp;·&nbsp; Действительно до: <b>31.05.2026</b></div>
   <div class="school">ОРГАНИЗАЦИЯ ШКОЛЫ № ____</div>
  </div>
  <svg class="stamp" viewBox="0 0 200 200">
   <circle cx="100" cy="100" r="92" fill="none" stroke="#9aa6c8" stroke-width="5"/>
   <circle cx="100" cy="100" r="66" fill="none" stroke="#9aa6c8" stroke-width="2"/>
   <path id="arc" d="M100 100 m-79 0 a79 79 0 1 1 158 0 a79 79 0 1 1 -158 0" fill="none"/>
   <text font-size="17" fill="#9aa6c8" letter-spacing="3" font-family="DejaVu Sans" font-weight="bold"><textPath href="#arc">★ ОРГАНИЗАЦИЯ «ФСИН» ★ ШКОЛА № ____ ★</textPath></text>
   <text x="100" y="112" text-anchor="middle" font-size="34" font-weight="bold" fill="#9aa6c8" font-family="DejaVu Serif">ФСИН</text>
  </svg>
  <div class="sign"><div class="line">Петров</div>Начальник ФСИН</div>
 </div>
</div>`;
const BACK = p => `<div class="card back"><svg class="wm"><use href="#emb"/></svg>
 <div class="oath">
  <svg><use href="#emb"/></svg>
  <div class="motto">ЧЕСТЬ<br>ПОРЯДОК<br>ВЕРНОСТЬ СВОИМ</div>
  <div class="vow">«Клянусь хранить честь ФСИН, стоять за своих и соблюдать устав организации»</div>
 </div>
 <div class="pw">
  <h2>ВЛАДЕЛЕЦ ИМЕЕТ ПРАВО</h2>
  <ol>${(p.powers || DEFAULT_POWERS).map(x => `<li>${x}</li>`).join('')}</ol>
  <div class="ownsign"><div><div class="ln"></div>Подпись владельца</div><div class="serial">SN ${p.sn}</div></div>
  <div class="note">Организация школы № ____ · не является государственным документом</div>
 </div>
</div>`;
const DEFAULT_POWERS = ["Представлять организацию ФСИН", "Участвовать в операциях своего отдела", "Требовать соблюдения устава ФСИН"];
const sheet = document.getElementById('sheet');
for (const p of people) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="slot">${FRONT(p)}</div><div class="slot">${BACK(p)}</div>`;
  sheet.appendChild(row);
}
// ужать шрифт, если строка не влезает
document.querySelectorAll('.v').forEach(v => { let f = parseFloat(getComputedStyle(v).fontSize); while (v.scrollWidth > v.clientWidth && f > 16) v.style.fontSize = (f -= 1) + 'px'; });
sheet.insertAdjacentHTML('beforeend','<div class="hint">Вырезать по пунктиру → согнуть пополам по средней линии → склеить</div>');
</script>
</body></html>
