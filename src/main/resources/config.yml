listing:
  enabled: true
  interval-seconds: 90
  per-cycle: 2
  max-bot-listings: 40
  listing-hours: 12
  amount-min: 1
  amount-max: 16
  normal-mult-min: 0.90
  normal-mult-max: 1.35
  overprice-chance: 0.12
  overprice-mult-min: 1.60
  overprice-mult-max: 2.30
  # Chance a listing is drawn from the enchantable-gear pool (weapons/tools/armor)
  # instead of plain resources. Combined with enchant.item-chance below being forced
  # to "always try" for gear, most listings end up enchanted items.
  gear-chance: 0.80
  # Chance a listing is an Enchanted Book (with random stored enchants) instead of an item.
  book-chance: 0.15
  whitelist: []
  blacklist:
    - "BEDROCK"
    - "COMMAND_BLOCK"
    - "BARRIER"
    - "SPAWNER"
    - "DEBUG_STICK"

buying:
  enabled: true
  interval-seconds: 60
  per-cycle: 3
  buy-threshold: 1.05
  buy-from-bots: false
  pay-sellers: true

reselling:
  enabled: true
  interval-seconds: 120
  per-cycle: 4
  markup-min: 1.20
  markup-max: 1.55

# Randomized enchants on freshly listed bot items (Timer A only).
# Validity is checked via Bukkit's own Enchantment#canEnchantItem, so e.g.
# Density can only ever land on a Mace, never on a sword.
enchant:
  enabled: true
  item-chance: 0.35       # chance a freshly listed item gets enchants at all
  max-count: 3            # max distinct enchants per item
  allow-curses: false
  allow-overlevel: true    # allow levels above vanilla max for extra variety
  overlevel-chance: 0.15
  overlevel-max-bonus: 2
  price-per-level-mult: 0.15
