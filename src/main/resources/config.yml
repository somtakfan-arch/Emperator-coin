# ========================================
# Меч Императора — Конфигурация
# BedSMP | bedsmp.pro
# ========================================

# Разрешить ли игроку иметь несколько Мечей Императора
# false = только один меч на игрока (рекомендуется)
allow-multiple-swords: false

# Привязывать ли меч к владельцу
# true = только владелец может использовать меч для прогресса
# (другие игроки могут держать меч, но прогресс к ним не идёт)
bind-to-owner: true

# Дропается ли меч при смерти игрока
# true = меч можно подобрать — важно для анархии BedSMP
drop-on-death: true

# Звуки при апгрейде уровня
sounds:
  enabled: true
  level-up: ENTITY_PLAYER_LEVELUP
  volume: 1.0
  pitch: 1.0

# Показывать ли Title на экране при апгрейде
titles:
  enabled: true
  fade-in: 10
  stay: 60
  fade-out: 20

# Обновление lore меча (в тиках, 20 = 1 секунда)
# Определяет как часто обновляется прогресс в lore
lore-update-interval: 40

# Минимальный интервал между проверками апгрейда (в тиках)
upgrade-check-interval: 20
