listing:
  enabled: true
  interval-seconds: 45
  per-cycle: 35
  max-bot-listings: 100000000000
  listing-hours: 38
  amount-min: 1
  amount-max: 64
  normal-mult-min: 1.1
  normal-mult-max: 2.5
  overprice-chance: 0.15
  overprice-mult-min: 2.5
  overprice-mult-max: 4.0
  gear-chance: 0.80
  book-chance: 0.15
  potion-chance: 0.08
  meta-enchant-chance: 0.50
  whitelist: []
  blacklist:
    - "BEDROCK"
    - "COMMAND_BLOCK"
    - "BARRIER"
    - "SPAWNER"
    - "DEBUG_STICK"

buying:
  enabled: true
  interval-seconds: 60
  per-cycle: 3
  buy-threshold: 1.05
  buy-from-bots: false
  pay-sellers: true

reselling:
  enabled: true
  interval-seconds: 120
  per-cycle: 4
  markup-min: 1.20
  markup-max: 1.55

enchant:
  enabled: true
  item-chance: 0.85
  max-count: 3
  allow-curses: false
  allow-overlevel: true
  overlevel-chance: 0.15
  overlevel-max-bonus: 2
  price-per-level-mult: 0.15

# Chat-triggered listings: игрок пишет в чат, бот сразу выставляет предмет.
chat-requests:
  enabled: true
  api-key: ""   # вставь свой ключ с console.groq.com
  model: "llama-3.3-70b-versatile"
  api-url: "https://api.groq.com/openai/v1/chat/completions"
  # --- xAI Grok (платно, ~$0.30/1M токенов) ---
  # api-key: "xai-..."
  # model: "grok-3-mini"
  # api-url: "https://api.x.ai/v1/chat/completions"
  triggers:
    - "пж выстави"
    - "бот выстави"
    - "выстави"
    - "выставьте"
    - "пж выставьте"
  cooldown-seconds: 30
  price-markup: 1.2
  unknown-base-price: 10.0

# Зелья PvP — бот выставляет их согласно potion-chance в listing.
pvp-potions:
  enabled: true
  types:
    # ── DPot PvP ──────────────────────────────────────────────
    - potion-type: "STRONG_HARMING"      # Зелье вреда II (сплэш)
      form: splash
      price: 3000
    - potion-type: "HARMING"             # Зелье вреда I (сплэш)
      form: splash
      price: 1500
    - potion-type: "STRONG_HEALING"      # Зелье лечения II (сплэш)
      form: splash
      price: 5000
    - potion-type: "HEALING"             # Зелье лечения I (сплэш)
      form: splash
      price: 2500
    - potion-type: "STRONG_STRENGTH"     # Зелье силы II (сплэш)
      form: splash
      price: 4000
    - potion-type: "STRENGTH"            # Зелье силы I (питьё)
      form: drinkable
      price: 2500
    - potion-type: "STRONG_SWIFTNESS"    # Зелье скорости II (питьё)
      form: drinkable
      price: 2500
    - potion-type: "WEAKNESS"            # Зелье слабости (сплэш)
      form: splash
      price: 2000
    - potion-type: "STRONG_SLOWNESS"     # Зелье замедления IV (сплэш)
      form: splash
      price: 3000
    - potion-type: "STRONG_POISON"       # Зелье яда II (сплэш)
      form: splash
      price: 2000
    - potion-type: "STRONG_REGENERATION" # Зелье регенерации II (питьё)
      form: drinkable
      price: 4000
    # ── Общие боевые ──────────────────────────────────────────
    - potion-type: "FIRE_RESISTANCE"     # Огнеупорность (питьё)
      form: drinkable
      price: 2000
    - potion-type: "LONG_FIRE_RESISTANCE" # Огнеупорность+ (питьё)
      form: drinkable
      price: 3000
    - potion-type: "INVISIBILITY"        # Невидимость (питьё)
      form: drinkable
      price: 3000
    - potion-type: "SLOW_FALLING"        # Мягкое падение (питьё)
      form: drinkable
      price: 1500
    - potion-type: "STRONG_TURTLE_MASTER" # Панцирь мастер II (питьё)
      form: drinkable
      price: 5000
    # ── Crystal PvP ───────────────────────────────────────────
    - potion-type: "STRONG_HARMING"      # Дымящееся зелье вреда II
      form: lingering
      price: 7000
    - potion-type: "STRONG_POISON"       # Дымящееся зелье яда II
      form: lingering
      price: 4000
    # ── 1.21 ──────────────────────────────────────────────────
    - potion-type: "WIND_CHARGED"        # Зелье заряда ветра (сплэш)
      form: splash
      price: 6000

# Кастомные предметы сервера — берутся из YAML-базы плагина (напр. EmperorSword).
# custom-chance в секции listing определяет шанс выставить кастомку (0.03 = 3%).
custom-items:
  enabled: true
  file: "plugins/ItemEdit/database/server-database.yml"
  default-price: 300000
  prices:
    sword: 500000          # Кинжал Тени
    wind_burst: 150000     # Зов Бури
    elytra: 2000000        # Вуаль Тени
    mace: 1500000          # Разрушитель Миров
    pearl: 200000          # Око Гездны
    arbalet: 300000        # Гром (арбалет)
    topor: 800000          # Мьёльнир
    kopie: 700000          # Ярость Ада
    eda: 80000             # Обед Дракона
    bogat: 400000          # Слиток Миллиардера
    oko: 250000            # Oko Смерти
    totem: 900000          # Древний Идол
    super_rocket: 60000    # Тяжелый Заряд
    1tap: 5000000          # Гром (1tap)
    onetap: 3000000        # ONE TAP

# Именные предметы — создаются из материала + имени (Skript-предметы, ThornsWard).
