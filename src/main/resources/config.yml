# ============================================================
#  BedBots — ИИ-боты для BedSMP
#  Боты ходят по миру (Citizens) и общаются в чате через Groq AI
# ============================================================

groq:
  # Ключ с console.groq.com -> API Keys (бесплатно, без карты)
  api-key: "ВСТАВЬ_СЮДА_СВОЙ_GROQ_КЛЮЧ"
  # llama-3.1-8b-instant  -> быстрый, лимит ~14400/день (рекомендую)
  # llama-3.3-70b-versatile -> умнее, но лимит ~1000/день
  model: "llama-3.1-8b-instant"
  max-tokens: 80
  temperature: 0.9

chat:
  reply-chance: 0.25          # шанс ответа на случайное сообщение (0.0–1.0)
  reply-on-mention: true      # всегда отвечать, если в сообщении есть ник бота
  global-cooldown-seconds: 6  # минимум секунд между любыми ответами ботов
  bot-cooldown-seconds: 20    # минимум секунд между ответами одного бота
  history-size: 8             # сколько последних сообщений чата помнят боты
  reply-delay-min-ms: 800     # задержка перед ответом (чтобы выглядело по-людски)
  reply-delay-max-ms: 2500

presence:
  spawn-on-start: true
  world: ""                   # пусто = главный мир сервера
  spread-radius: 6            # разброс ботов вокруг точки спавна
  wander: true               # боты ходят случайным образом
  wander-radius: 12          # как далеко боты отходят от своей точки
  wander-interval-seconds: 8
  look-at-players: true

serverlist:
  # Показывать ботов в счётчике онлайна в списке серверов
  fake-online: true

# Боты. skin = ник игрока, чей скин надеть (например Steve, Alex, Notch или любой ник).
bots:
  - name: "Дамир_2012"
    skin: "Steve"
    personality: "Ты — школьник 12 лет, новичок на BedSMP. Наивный, восторженный, постоянно спрашиваешь как что работает и боишься потерять свои кровати."
  - name: "xX_Кригер_Xx"
    skin: "Herobrine"
    personality: "Ты — самоуверенный PvP-игрок. Подкалываешь других и хвастаешься килами, но без настоящих оскорблений. Любишь анархию."
  - name: "tofu_btw"
    skin: "Alex"
    personality: "Ты — спокойный знаток сервера. Любишь давать советы про защиту кроватей и механики. Немного занудный, но добрый."
  - name: "Соня"
    skin: "Notch"
    personality: "Ты — дружелюбная девчонка, болтаешь обо всём, шутишь и поддерживаешь новичков."
