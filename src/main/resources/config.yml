listing:
  enabled: true
  interval-seconds: 45
  per-cycle: 5
  max-bot-listings: 1000000000
  listing-hours: 120
  amount-min: 1
  amount-max: 64
  normal-mult-min: 5.0
  normal-mult-max: 10.0
  overprice-chance: 0.20
  overprice-mult-min: 10.0
  overprice-mult-max: 15.0
  gear-chance: 0.80
  book-chance: 0.15
  meta-enchant-chance: 0.50
  whitelist: []
  blacklist:
    - "BEDROCK"
    - "COMMAND_BLOCK"
    - "BARRIER"
    - "SPAWNER"
    - "DEBUG_STICK"

buying:
  enabled: true
  interval-seconds: 60
  per-cycle: 3
  buy-threshold: 1.05
  buy-from-bots: false
  pay-sellers: true

reselling:
  enabled: true
  interval-seconds: 120
  per-cycle: 4
  markup-min: 1.20
  markup-max: 1.55

enchant:
  enabled: true
  item-chance: 0.85
  max-count: 3
  allow-curses: false
  allow-overlevel: true
  overlevel-chance: 0.15
  overlevel-max-bonus: 2
  price-per-level-mult: 0.15

# Chat-triggered listings: игрок пишет в чат, бот сразу выставляет предмет.
chat-requests:
  enabled: true
  api-key: ""   # вставь свой ключ с console.groq.com
  model: "llama-3.3-70b-versatile"
  api-url: "https://api.groq.com/openai/v1/chat/completions"
  # --- xAI Grok (платно, ~$0.30/1M токенов) ---
  # api-key: "xai-..."
  # model: "grok-3-mini"
  # api-url: "https://api.x.ai/v1/chat/completions"
  triggers:
    - "пж выстави"
    - "бот выстави"
    - "выстави"
  cooldown-seconds: 30
  price-markup: 1.2
  unknown-base-price: 10.0
