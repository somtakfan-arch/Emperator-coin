# ========================================
# Меч Императора — Уровни
# Можно добавлять новые уровни без перекомпиляции!
# ========================================
# Типы квестов:
#   MOB_KILLS       — убийства враждебных мобов
#   PLAYER_KILLS    — убийства игроков
#   BEDS_DESTROYED  — уничтожение чужих кроватей
#   DIAMONDS_MINED  — добыча алмазной руды (алмаз + алмазная руда)
#   DISTANCE_WALKED — пройденное расстояние (в метрах)
#   DAMAGE_DEALT    — суммарный нанесённый урон (в половинах сердца)
# ========================================

levels:
  # ——————————————————
  # Начальный уровень: выдаётся игроку без условий
  # ——————————————————
  1:
    name: "<gray>Клинок Новичка</gray>"
    lore-title: "<dark_gray>Путь только начинается...</dark_gray>"
    requirements: {}
    enchants:
      sharpness: 3
      unbreaking: 2
    unbreakable: false

  # ——————————————————
  # Убей 50 мобов
  # ——————————————————
  2:
    name: "<white>Клинок Воина</white>"
    lore-title: "<gray>Первая кровь пролита.</gray>"
    requirements:
      MOB_KILLS: 50
    enchants:
      sharpness: 4
      unbreaking: 2
      knockback: 1
    unbreakable: false

