  4:
    name: "<gold>Клинок Рейдера</gold>"
    lore-title: "<gray>Ни одна кровать не в безопасности.</gray>"
    requirements:
      BEDS_DESTROYED: 10
    enchants:
      sharpness: 6
      unbreaking: 3
      knockback: 2
      fire_aspect: 1
    unbreakable: false

