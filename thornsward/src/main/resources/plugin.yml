name: ThornsWard
version: '${project.version}'
main: com.bedsmp.thornsward.ThornsWardPlugin
api-version: '1.21'
author: BedSMP
description: Оберег Терновника — гасит урон и отбрасывание от Шипов (Thorns) любого уровня.

commands:
  thornsward:
    description: Выдать Оберег Терновника
    usage: "/<command> give [игрок]"
    permission: bedsmp.thornsward.give
    permission-message: "§cУ вас нет прав на эту команду."
  crystallersword:
    description: Выдать Меч Кристаллера
    usage: "/<command> give [игрок]"
    permission: bedsmp.crystallersword.give
    permission-message: "§cУ вас нет прав на эту команду."
  amethystaxe:
    description: Выдать Топор Аметиста
    usage: "/<command> give [игрок]"
    permission: bedsmp.amethystaxe.give
    permission-message: "§cУ вас нет прав на эту команду."
  nemesis:
    description: Выдать Немезиду (следящий арбалет)
    usage: "/<command> give [игрок]"
    permission: bedsmp.nemesis.give
    permission-message: "§cУ вас нет прав на эту команду."
  phantom:
    description: Выдать Призрак (арбалет сквозь стены)
    usage: "/<command> give [игрок]"
    permission: bedsmp.phantom.give
    permission-message: "§cУ вас нет прав на эту команду."
  mirrorshield:
    description: Выдать Зеркало Немезиды (щит отражения стрел)
    usage: "/<command> give [игрок]"
    permission: bedsmp.mirrorshield.give
    permission-message: "§cУ вас нет прав на эту команду."
  instantapple:
    description: Выдать Яблоко Богов (мгновенное зачарованное яблоко)
    usage: "/<command> give [игрок]"
    permission: bedsmp.instantapple.give
    permission-message: "§cУ вас нет прав на эту команду."
  revengethorn:
    description: Выдать Шип Возмездия (нагрудник телепортации к атакующему)
    usage: "/<command> give [игрок]"
    permission: bedsmp.revengethorn.give
    permission-message: "§cУ вас нет прав на эту команду."
  soullantern:
    description: Выдать Фонарь Душ (блокирует спавн мобов вокруг)
    usage: "/<command> give [игрок]"
    permission: bedsmp.soullantern.give
    permission-message: "§cУ вас нет прав на эту команду."
  dragonroar:
    description: Выдать Рёв Дракона (булава с ударной волной)
    usage: "/<command> give [игрок]"
    permission: bedsmp.dragonroar.give
    permission-message: "§cУ вас нет прав на эту команду."
  zeustrident:
    description: Выдать Трезубец Зевса (молния при броске)
    usage: "/<command> give [игрок]"
    permission: bedsmp.zeustrident.give
    permission-message: "§cУ вас нет прав на эту команду."
  spiritmask:
    description: Выдать Маску Духа (мобы игнорируют)
    usage: "/<command> give [игрок]"
    permission: bedsmp.spiritmask.give
    permission-message: "§cУ вас нет прав на эту команду."
  shadowcloak:
    description: Выдать Плащ Теней (невидимость при неподвижности)
    usage: "/<command> give [игрок]"
    permission: bedsmp.shadowcloak.give
    permission-message: "§cУ вас нет прав на эту команду."
  ironcanopy:
    description: Выдать Железный Полог (щит отталкивания)
    usage: "/<command> give [игрок]"
    permission: bedsmp.ironcanopy.give
    permission-message: "§cУ вас нет прав на эту команду."
  leviathanarmor:
    description: Выдать Кольчугу Левиафана (защита в воде)
    usage: "/<command> give [игрок]"
    permission: bedsmp.leviathanarmor.give
    permission-message: "§cУ вас нет прав на эту команду."
  thiefhood:
    description: Выдать Капюшон Вора (одноразовое спасение от смерти)
    usage: "/<command> give [игрок]"
    permission: bedsmp.thiefhood.give
    permission-message: "§cУ вас нет прав на эту команду."
  chronostone:
    description: Выдать Хронокамень (заморозка времени, одноразовый)
    usage: "/<command> give [игрок]"
    permission: bedsmp.chronostone.give
    permission-message: "§cУ вас нет прав на эту команду."
  spiderthread:
    description: Выдать Нить Паука (удочка с огромной силой)
    usage: "/<command> give [игрок]"
    permission: bedsmp.spiderthread.give
    permission-message: "§cУ вас нет прав на эту команду."
  phoenixash:
    description: Выдать Пепел Феникса (авто-воскрешение)
    usage: "/<command> give [игрок]"
    permission: bedsmp.phoenixash.give
    permission-message: "§cУ вас нет прав на эту команду."
  echopast:
    description: Выдать Эхо Прошлого (3 заряда телепорта назад)
    usage: "/<command> give [игрок]"
    permission: bedsmp.echopast.give
    permission-message: "§cУ вас нет прав на эту команду."
  gravitytrap:
    description: Выдать Ловушку Гравитации (бросаемая зона притяжения)
    usage: "/<command> give [игрок]"
    permission: bedsmp.gravitytrap.give
    permission-message: "§cУ вас нет прав на эту команду."
  chaoswhistle:
    description: Выдать Свисток Хаоса (вызов моба у врага)
    usage: "/<command> give [игрок]"
    permission: bedsmp.chaoswhistle.give
    permission-message: "§cУ вас нет прав на эту команду."
  serverheart:
    description: Выдать Сердце Сервера (трансляция координат)
    usage: "/<command> give [игрок]"
    permission: bedsmp.serverheart.give
    permission-message: "§cУ вас нет прав на эту команду."
  voodoodoll:
    description: Выдать Куклу Вуду (зеркальный урон)
    usage: "/<command> give [игрок]"
    permission: bedsmp.voodoodoll.give
    permission-message: "§cУ вас нет прав на эту команду."
  chaosfeather:
    description: Выдать Перо Хаоса (случайные эффекты скорости)
    usage: "/<command> give [игрок]"
    permission: bedsmp.chaosfeather.give
    permission-message: "§cУ вас нет прав на эту команду."

