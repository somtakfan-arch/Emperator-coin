name: ThornsWard
version: '${project.version}'
main: com.bedsmp.thornsward.ThornsWardPlugin
api-version: '1.21'
author: BedSMP
description: Оберег Терновника — гасит урон и отбрасывание от Шипов (Thorns) любого уровня.

commands:
  thornsward:
    description: Выдать Оберег Терновника
    usage: "/<command> give [игрок]"
    permission: bedsmp.thornsward.give
    permission-message: "§cУ вас нет прав на эту команду."
  crystallersword:
    description: Выдать Меч Кристаллера
    usage: "/<command> give [игрок]"
    permission: bedsmp.crystallersword.give
    permission-message: "§cУ вас нет прав на эту команду."
  amethystaxe:
    description: Выдать Топор Аметиста
    usage: "/<command> give [игрок]"
    permission: bedsmp.amethystaxe.give
    permission-message: "§cУ вас нет прав на эту команду."
  nemesis:
    description: Выдать Немезиду (следящий арбалет)
    usage: "/<command> give [игрок]"
    permission: bedsmp.nemesis.give
    permission-message: "§cУ вас нет прав на эту команду."
  phantom:
    description: Выдать Призрак (арбалет сквозь стены)
    usage: "/<command> give [игрок]"
    permission: bedsmp.phantom.give
    permission-message: "§cУ вас нет прав на эту команду."
  mirrorshield:
    description: Выдать Зеркало Немезиды (щит отражения стрел)
    usage: "/<command> give [игрок]"
    permission: bedsmp.mirrorshield.give
    permission-message: "§cУ вас нет прав на эту команду."

permissions:
  bedsmp.thornsward.give:
    description: Позволяет выдавать Оберег Терновника
    default: op
  bedsmp.crystallersword.give:
    description: Позволяет выдавать Меч Кристаллера
    default: op
  bedsmp.amethystaxe.give:
    description: Позволяет выдавать Топор Аметиста
    default: op
  bedsmp.nemesis.give:
    description: Позволяет выдавать Немезиду
    default: op
  bedsmp.phantom.give:
    description: Позволяет выдавать Призрак
    default: op
  bedsmp.mirrorshield.give:
    description: Позволяет выдавать Зеркало Немезиды
    default: op
