# ThornsWard — настройки
#
# only-block-thorns-from-players:
#   false (по умолчанию) — гасить урон/отбрасывание от Шипов ЛЮБОГО источника,
#                           включая мобов с зачарованной бронёй (NBT).
#   true  — гасить только если носитель Шипов (тот, кто нанёс ответный урон) — игрок.
only-block-thorns-from-players: false

# Меч Кристаллера — при ударе подбрасывает противника строго вверх,
# полностью отменяя горизонтальный (дальний) отброс.
crystaller-sword:
  # Вертикальная скорость, которую получает игрок при ударе (блоки/тик).
  # Это значение НЕ равно высоте прыжка напрямую — высота зависит от
  # гравитации и сопротивления воздуха. Ниже — таблица соответствия
  # (рассчитана для обычной гравитации живых существ, без эффектов
  # вроде Невесомости/Левитации):
  #   1.0 блок  -> 0.451
  #   1.5 блока -> 0.548
  #   2.0 блока -> 0.630   (значение по умолчанию)
  #   2.5 блока -> 0.704
  #   3.0 блока -> 0.771
  #   4.0 блока -> 0.891
  #   5.0 блока -> 0.998
  launch-up-velocity: 0.63

# Топор Аметиста — срубает дерево целиком (все соединённые брёвна за один удар).
amethyst-axe:
  # Максимальное количество брёвен, которые будут срублены за один удар.
  # Защита от лагов при работе с огромными деревьями или массивами из брёвен.
  max-blocks: 150

# Немезида — следящий арбалет: стрела поворачивает за целью каждый тик.
nemesis-crossbow:
  # Радиус поиска цели в момент выстрела (блоки). Дальше стрела летит обычно.
  tracking-radius: 20.0
  # Скорость стрелы при слежении (блоки/тик). Ваниль ≈ 3.0; 2.0 даёт шанс уйти за укрытие.
  tracking-speed: 2.0

# Призрак — арбалет, прошивающий стены: стрела насквозь проходит через твёрдые блоки.
phantom-crossbow:
  # Максимальная суммарная толщина стен за один полёт стрелы (блоки).
  wall-penetration-blocks: 15

# Зеркало Немезиды — щит, отражающий входящие стрелы обратно в стрелявшего.
mirror-shield:
  # Скорость отражённой стрелы при слежении (блоки/тик). Чуть выше Немезиды = опаснее.
  tracking-speed: 2.5

# Яблоко Богов — мгновенное съедание без анимации, восстанавливает голод + эффекты бога.
instant-apple:
  # Кулдаун в секундах между использованиями (0 = без кулдауна).
  cooldown-seconds: 0

# Шип Возмездия — нагрудник, телепортирующий к последнему атакующему игроку.
revenge-thorn:
  # Кулдаун в секундах между использованиями способности.
  teleport-cooldown-seconds: 20
  # Максимальная дальность телепортации (блоки). Дальше — способность не работает.
  max-range-blocks: 50
  # На сколько блоков ты телепортируешься от атакующего игрока.
  teleport-distance: 3

# Фонарь Душ — блокирует естественный спавн мобов в радиусе вокруг владельца.
soul-lantern:
  duration-seconds: 30
  no-spawn-radius: 5

# Рёв Дракона — при ударе создаёт ударную волну, подбрасывающую всех рядом.
dragon-roar:
  shockwave-radius: 5.0
  launch-velocity: 0.9

# Плащ Теней — невидимость при неподвижности.
shadow-cloak:
  still-seconds: 2.0

# Железный Полог — щит с отталкивающей сферой при блоке.
iron-canopy:
  repel-radius: 4.0
  repel-strength: 1.5

# Кольчуга Левиафана — снижение урона в воде.
leviathan-armor:
  damage-reduction: 3.0

# Капюшон Вора — одноразовое спасение от смерти с телепортацией.
thiefs-hood:
  survive-health: 4.0
  teleport-distance: 15.0

# Хронокамень — заморозка + невидимость + неуязвимость на N секунд.
chrono-stone:
  freeze-seconds: 5
  speed-duration-seconds: 3

# Нить Паука — рыболовная удочка с огромной силой притяжения.
spider-thread:
  pull-force: 4.0

# Пепел Феникса — автоматическое воскрешение при смерти.
phoenix-ash:
  revive-health: 8.0

# Эхо Прошлого — телепорт к позиции N секунд назад (3 заряда).
echo-past:
  history-seconds: 30

# Ловушка Гравитации — бросаемый снаряд создаёт зону притяжения.
gravity-trap:
  pull-radius: 4.0
  duration-seconds: 5

# Свисток Хаоса — вызывает случайного моба у ближайшего врага.
chaos-whistle:
  cooldown-seconds: 30

# Сердце Сервера — раскрывает координаты всем игрокам.
server-heart:
  reveal-seconds: 10
  cooldown-seconds: 60
