<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Emperator Exchange — симулятор</title>
<meta name="description" content="Симулятор криптобиржи с виртуальными деньгами. Живые цены, без реальных платежей." />
<meta name="theme-color" content="#08090b" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="topbar glass-bar">
  <div class="sim-strip">Симулятор · деньги виртуальные</div>
  <div class="topbar-row container">
    <a class="brand" href="#/markets" aria-label="Emperator Exchange">
      <span class="brand-mark">EMPERATOR</span>
      <span class="brand-sub">exchange</span>
    </a>
    <nav class="nav-desktop" id="navDesktop" hidden></nav>
    <div class="user-slot" id="userSlot"></div>
  </div>
</header>

<main class="container main" id="view" aria-live="polite">
  <div class="boot"><div class="spinner"></div></div>
</main>

<nav class="tabbar glass-bar" id="tabbar" hidden></nav>

<div class="toasts" id="toasts" aria-live="assertive"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
