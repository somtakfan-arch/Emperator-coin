# ============================================================
#  BedNoFireworks — конфиг
#  Плагин удаляет фейерверки ОТОВСЮДУ: инвентари, сундуки,
#  шалкеры (в том числе шалкеры внутри сундуков), заряженные
#  арбалеты, дроп на земле, лут, торговцев — и запрещает
#  использование, крафт и разгон на элитрах.
# ============================================================

# Полностью включить/выключить работу плагина.
enabled: true

# Что именно удалять.
remove:
  # Сам фейерверк (ракета).
  firework-rocket: true
  # Звёздочка фейерверка (заготовка для крафта).
  firework-star: true
  # Выгружать ракеты из заряженных арбалетов.
  loaded-crossbows: true
  # Удалять уже запущенные фейерверки в воздухе.
  entities: true

# Что запрещать.
block:
  # Использование ракеты в руке (в том числе разгон на элитрах).
  use: true
  # Крафт ракет и звёздочек — рецепты удаляются с сервера.
  crafting: true
  # Раздатчики не выстреливают фейерверками.
  dispensers: true
  # Нельзя зарядить арбалет ракетой и выстрелить ей.
  crossbow: true

# Обрабатывать перемещение предметов воронками/раздатчиками.
hook-hoppers: true

# Писать в консоль каждое удаление (только для отладки — очень спамно).
log-to-console: false

# Итоговая сводка после стартового сканирования и /nofireworks scan.
log-summary: true

# Исключения по праву bednofireworks.bypass.
# По умолчанию выключено: чистится абсолютно всё, включая админов.
bypass:
  enabled: false
  permission: bednofireworks.bypass

# Ограничение по мирам.
#   mode: blacklist — плагин работает везде, кроме миров из list
#   mode: whitelist — плагин работает ТОЛЬКО в мирах из list
worlds:
  mode: blacklist
  list: []

# Фоновая зачистка загруженных чанков.
sweep:
  enabled: true
  # Как часто запускать полный проход (в тиках, 20 тиков = 1 сек).
  interval-ticks: 1200
  # Сколько чанков обрабатывать за один тик (меньше = мягче для TPS).
  chunks-per-tick: 10
  # Дополнительно чистить инвентари онлайн-игроков каждый проход.
  players: true
  # Чистить чанк сразу при его загрузке (так очищается весь мир по мере игры).
  on-chunk-load: true

# Сообщения (поддерживаются коды цветов через &).
messages:
  prefix: '&8[&dBedNoFireworks&8] &r'
  no-permission: '&cНет прав.'
  reloaded: '&aКонфиг перезагружен.'
  scan-started: '&eЗапускаю полную зачистку загруженных чанков...'
  scan-done: '&aГотово. Удалено фейерверков: &f%items%&a, чанков: &f%chunks%&a, игроков: &f%players%&a.'
  toggled-on: '&aПлагин включён.'
  toggled-off: '&cПлагин выключен.'
  use-blocked: '&cНа BedSMP фейерверки отключены.'
