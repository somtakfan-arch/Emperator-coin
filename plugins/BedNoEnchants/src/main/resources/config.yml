# ============================================================
#  BedNoEnchants — конфиг
#  Плагин снимает зачарования со ВСЕХ предметов: инвентари,
#  сундуки, шалкеры (в том числе шалкеры внутри сундуков),
#  дропнутые вещи, рамки, мобы, вагонетки, лут-сундуки и т.д.
# ============================================================

# Полностью включить/выключить работу плагина.
enabled: true

# Превращать зачарованные книги в обычные книги.
# false — книга останется зачарованной книгой, но без чар.
convert-enchanted-books: true

# ============================================================
#  ВАНИЛЬНЫЕ ХАРАКТЕРИСТИКИ ОРУЖИЯ И БРОНИ
# ============================================================
# Сбрасывает кастомные характеристики предметов до стандартных ванильных:
# урон и скорость атаки, броня и вязкость, отбрасывание, скорость ходьбы,
# доп. здоровье, кастомная прочность, неломаемость, кастомная еда, тотемы,
# поведение щита, дальность удара и т.д.
#
# Ванильные предметы НЕ меняются: алмазный меч так и останется алмазным мечом
# со своим обычным уроном. Убирается только то, что накрутили сверху.
vanilla-gear:
  enabled: true
  # Список компонентов, которые возвращаются к ванильным значениям.
  # Можно убирать/добавлять любые компоненты Minecraft 1.21.
  components:
    - attribute_modifiers    # урон, скорость атаки, броня, вязкость, отбрасывание, скорость, здоровье
    - unbreakable            # неломаемость
    - max_damage             # кастомная прочность
    - repair_cost            # накрученная цена на наковальне
    - tool                   # скорость копания, урон по блокам
    - weapon                 # урон по прочности, пробитие щита
    - piercing_weapon        # пробивающее оружие
    - kinetic_weapon         # кинетическое оружие
    - attack_range           # дальность удара
    - swing_animation        # анимация удара
    - minimum_attack_charge  # минимальный заряд удара
    - damage_type            # тип наносимого урона
    - blocks_attacks         # блокирование урона (кастомные щиты)
    - equippable             # надеть что угодно куда угодно
    - enchantable            # зачаровываемость
    - repairable             # чем чинится
    - glider                 # полёт как на элитрах
    - death_protection       # эффект тотема на любом предмете
    - damage_resistant       # иммунитет к огню/лаве
    - intangible_projectile
    - use_cooldown           # кастомный кулдаун использования
    - use_remainder
    - use_effects
    - consumable             # можно съесть/выпить
    - food                   # сытость и насыщение (кастомные "гэплы")
    - can_place_on
    - can_break
    - max_stack_size         # кастомный размер стака
    # --- Косметика. По умолчанию НЕ трогаем, иначе поломаются меню /shop и /ah ---
    # - custom_name
    # - item_name
    # - lore
    # - custom_model_data
    # - item_model
    # - rarity
    # - custom_data

# Убирать принудительный "блеск" (enchantment_glint_override),
# чтобы предметы без чар не светились.
clear-glint-override: true

# Запретить зачаровывать вещи на столе зачарований.
block-enchanting-table: true

# Чистить результат наковальни / верстака / кузнечного стола / точила.
clean-workstation-results: true

# Чистить сделки жителей (зачарованные книги и броня у торговцев).
strip-villager-trades: true

# Обрабатывать перемещение предметов воронками/диспенсерами.
# Событие "горячее", но проверка дешёвая. Выключайте только при проблемах с TPS.
hook-hoppers: true

# Писать в консоль каждый факт очистки (только для отладки — очень спамно).
log-to-console: false

# Итоговая сводка после стартового сканирования и /noenchants scan.
log-summary: true

# Исключения по праву bednoenchants.bypass.
# По умолчанию выключено: чистится АБСОЛЮТНО всё, включая админов.
bypass:
  enabled: false
  permission: bednoenchants.bypass

# Ограничение по мирам.
#   mode: blacklist — плагин работает везде, кроме миров из list
#   mode: whitelist — плагин работает ТОЛЬКО в мирах из list
worlds:
  mode: blacklist
  list: []

# Фоновая зачистка загруженных чанков (сундуки, мобы, дроп, рамки...).
sweep:
  enabled: true
  # Как часто запускать полный проход по загруженным чанкам (в тиках, 20 тиков = 1 сек).
  interval-ticks: 1200
  # Сколько чанков обрабатывать за один тик (меньше = мягче для TPS).
  chunks-per-tick: 10
  # Дополнительно чистить инвентари онлайн-игроков каждый проход.
  players: true
  # Чистить чанк сразу при его загрузке (рекомендуется: так очищается весь мир по мере игры).
  on-chunk-load: true

# Сообщения (поддерживаются коды цветов через &).
messages:
  prefix: '&8[&bBedNoEnchants&8] &r'
  no-permission: '&cНет прав.'
  reloaded: '&aКонфиг перезагружен.'
  scan-started: '&eЗапускаю полную зачистку загруженных чанков...'
  scan-done: '&aГотово. Очищено предметов: &f%items%&a, чанков: &f%chunks%&a, игроков: &f%players%&a.'
  toggled-on: '&aПлагин включён.'
  toggled-off: '&cПлагин выключен.'
  enchanting-blocked: '&cНа BedSMP зачарование отключено.'
