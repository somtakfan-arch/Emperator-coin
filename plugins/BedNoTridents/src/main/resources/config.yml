# ============================================================
#  BedNoTridents — конфиг
#  Удаляет трезубцы ОТОВСЮДУ (инвентари, сундуки, шалкеры,
#  шалкеры в сундуках, дроп, утопленники, лут) и снимает
#  трезубцовые чары со всех предметов и книг.
# ============================================================

enabled: true

# Что удалять.
remove:
  # Сам предмет "трезубец".
  tridents: true
  # Брошенные трезубцы, летящие в воздухе или воткнувшиеся в землю.
  entities: true

# Чары, которые снимаются со ВСЕХ предметов и книг.
enchantments:
  enabled: true
  # true — снимать вообще все чары (как BedNoEnchants). По умолчанию только список ниже.
  all: false
  list:
    - loyalty      # Верность
    - riptide      # Тягун
    - channeling   # Громовержец
    - impaling     # Пронзатель
  # Зачарованная книга, оставшаяся без чар, превращается в обычную книгу.
  convert-empty-books: true

# Что запрещать.
block:
  # Бросок трезубца и разгон Тягуном (правый клик с трезубцем).
  use: true
  # Зачарование трезубца и получение перечисленных чар на столе/наковальне.
  enchanting: true

# Обрабатывать перемещение предметов воронками/раздатчиками.
hook-hoppers: true

# Писать в консоль каждое удаление (только для отладки — очень спамно).
log-to-console: false

# Итоговая сводка после стартового сканирования и /notridents scan.
log-summary: true

# Исключения по праву bednotridents.bypass.
bypass:
  enabled: false
  permission: bednotridents.bypass

# Ограничение по мирам: blacklist — везде кроме списка, whitelist — только список.
worlds:
  mode: blacklist
  list: []

# Фоновая зачистка загруженных чанков.
sweep:
  enabled: true
  interval-ticks: 1200
  chunks-per-tick: 10
  players: true
  on-chunk-load: true

# Сообщения (коды цветов через &).
messages:
  prefix: '&8[&3BedNoTridents&8] &r'
  no-permission: '&cНет прав.'
  reloaded: '&aКонфиг перезагружен.'
  scan-started: '&eЗапускаю полную зачистку загруженных чанков...'
  scan-done: '&aГотово. Удалено трезубцев: &f%items%&a, чанков: &f%chunks%&a, игроков: &f%players%&a.'
  toggled-on: '&aПлагин включён.'
  toggled-off: '&cПлагин выключен.'
  use-blocked: '&cНа BedSMP трезубцы отключены.'
  enchanting-blocked: '&cЭти чары на BedSMP запрещены.'
